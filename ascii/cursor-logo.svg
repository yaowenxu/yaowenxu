<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="697" height="260" viewBox="0 0 697 260" role="img" aria-labelledby="title">
  <title id="title">Cursor character logo</title>
  <style>
    :root { color-scheme: light dark; }
    .fg { fill: #1f2328; }
    .muted { fill: #656d76; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e6edf3; }
      .muted { fill: #8b949e; }
    }
    text {
      font-family: "Courier New", Courier, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-kerning: none;
      font-variant-ligatures: none;
    }
    text { font-size: 13px; }
    .line {
      clip-path: inset(0 100% 0 0);
      animation: reveal 0.65s steps(78, end) forwards;
    }
    @keyframes reveal { to { clip-path: inset(0 0 0 0); } }
    .blink {
      animation: blink 1.05s step-end infinite;
      animation-delay: 1.8s;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
